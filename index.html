<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyhetsfocus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7f1;--card:#fff;--ink:#10261a;--muted:#5f7266;--line:#e1e9df;--green:#0b2e1b;--green2:#124a2b;--lime:#b8f26b;--accent:#0b2e1b;--accent2:#0b2e1b;--radius:20px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
a{color:inherit}
header.site{background:var(--green);color:#fff}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:12px;flex-wrap:wrap}
.logo{
  font-weight:800;
  font-size:28px;
  line-height:1;
  letter-spacing:-.5px;
  text-decoration:none;
  color:#fff;
  display:inline-flex;
  align-items:center;
  gap:12px;
}

.logoimg{
  width:56px;
  height:56px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 3px 10px rgba(0,0,0,.15);
}
.logo{
font-weight: 800;
font-size: 28px;
line-height:1;
letter-spacing:-.5px;
text-decoration:none;
color:#fff;
display:inline-flex;
align-itmes:center;
gap:12px;
}
.tag{font-size:12.5px;color:#9fc4ad;margin-top:5px}
nav.cats{background:rgba(243,247,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
nav.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none}
nav.cats a{padding:8px 15px;font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);white-space:nowrap;border-radius:999px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:.15s}
nav.cats a:hover{border-color:var(--green);transform:translateY(-1px)}
nav.cats a.on{background:var(--green);color:#fff;border-color:var(--green)}
.btn{background:var(--green);color:#fff;border:0;border-radius:999px;padding:10px 20px;font:700 14px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-decoration:none;display:inline-block;transition:.15s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(11,46,27,.22)}
.btn.lime{background:var(--lime);color:var(--green)}
.btn.alt{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.dark{background:var(--green2)}
.btn.danger{background:#fff;color:#b00020;border:1px solid #f0c0c8}
.btn.sm{padding:7px 13px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:wait}
header.site .btn.alt{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
header.site .btn:not(.alt):not(.dark){background:var(--lime);color:var(--green)}
header.site .btn.dark{background:#fff;color:var(--green)}
.intro{background:radial-gradient(1200px 400px at 85% -20%,#1d7a45 0%,transparent 60%),linear-gradient(135deg,var(--green) 0%,#0f4027 100%);color:#fff;border-radius:28px;padding:44px 40px;margin:22px 0 8px;position:relative;overflow:hidden}
.intro:after{content:"🔥 ⭐ 🎤 📱";position:absolute;right:26px;bottom:14px;font-size:34px;letter-spacing:10px;opacity:.9}
.badge{display:inline-block;background:rgba(184,242,107,.16);color:var(--lime);border:1px solid rgba(184,242,107,.4);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;margin-bottom:16px}
.intro h1{font-size:42px;line-height:1.08;margin:0 0 12px;letter-spacing:-1px;max-width:640px}
.intro h1 em{font-style:normal;color:var(--lime)}
.intro p{margin:0 0 22px;color:#cfe5d6;font-size:17px;max-width:560px}
.search{display:flex;gap:8px;margin:18px 0 6px}
.search input{flex:1;padding:13px 18px;border:1px solid var(--line);border-radius:999px;font:500 15px 'Plus Jakarta Sans',sans-serif;background:#fff}
.sec{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin:30px 0 4px;letter-spacing:-.3px}
.hero{display:grid;grid-template-columns:1.35fr 1fr;background:var(--card);border-radius:var(--radius);overflow:hidden;margin:16px 0;border:1px solid var(--line);cursor:pointer;transition:.2s;box-shadow:0 2px 0 rgba(11,46,27,.03)}
.hero:hover{transform:translateY(-3px);box-shadow:0 16px 34px rgba(11,46,27,.12)}
.hero .img{min-height:320px;background:#cfe0d3 center/cover}
.hero .body{padding:30px;display:flex;flex-direction:column;justify-content:center}
.hero h2{font-size:30px;line-height:1.15;margin:10px 0 12px;letter-spacing:-.6px}
.hero p{color:#41574a;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin:16px 0 44px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.2s}
.card:hover{transform:translateY(-5px);box-shadow:0 16px 34px rgba(11,46,27,.13)}
.card .img{height:180px;background:#cfe0d3 center/cover}
.card .body{padding:18px;display:flex;flex-direction:column;flex:1}
.card h3{margin:10px 0 8px;font-size:19px;line-height:1.25;letter-spacing:-.3px}
.card p{margin:0 0 14px;color:#41574a;font-size:14.5px;flex:1}
.meta{font-size:12.5px;color:var(--muted);font-weight:500}
.pill{display:inline-block;font-weight:800;font-size:12px;padding:5px 11px;border-radius:999px;background:#e5f6d3;color:#1d5a2c}
.draft{background:#fff3cd;color:#7a5b00;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:800;margin-left:6px}
article.full{background:#fff;border:1px solid var(--line);border-radius:28px;max-width:820px;margin:26px auto 50px;overflow:hidden}
article.full .cover{
    height:600px;
    background-position:center;
    background-repeat:no-repeat;
    background-size:contain;
    background-color:#f3f7f1;
}
article.full .in{padding:32px 40px 42px}
article.full h1{font-size:40px;line-height:1.1;margin:12px 0 12px;letter-spacing:-1px}
article.full .lead{font-size:20px;color:#41574a;margin:0 0 20px;font-weight:500}
.content{font-size:17.5px;line-height:1.75}
.content img{
    display:block;
    width:100%;
    max-width:100%;
    height:auto;
    border-radius:16px;
    margin:25px 0;
}

.content h2,.content h3{margin:30px 0 8px;letter-spacing:-.4px}
.content a{color:#0f6b3a;font-weight:600}
.content blockquote{border-left:5px solid var(--lime);background:#f3f9ec;border-radius:0 14px 14px 0;margin:20px 0;padding:10px 20px;color:#2b4234;font-weight:600}
.empty{text-align:center;color:var(--muted);padding:60px 0}
footer{background:var(--green);color:#9fc4ad;padding:34px 0;font-size:13.5px;margin-top:20px}
footer .wrap{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
footer b{color:#fff;font-size:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;margin:24px 0}
.panel h2{margin:0 0 14px;letter-spacing:-.4px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:.5px}
label{display:block;font-weight:700;font-size:13px;margin:14px 0 5px}
input[type=text],input[type=email],input[type=password],input[type=date],select,textarea{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font:500 15px 'Plus Jakarta Sans',sans-serif;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid var(--lime);border-color:var(--green)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.toolbar{display:flex;flex-wrap:wrap;gap:4px;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:6px;background:#f6faf4}
.toolbar button{border:1px solid var(--line);background:#fff;border-radius:8px;min-width:34px;height:32px;cursor:pointer;font-size:14px}
.toolbar button:hover{background:#e5f6d3}
#editor{min-height:300px;border:1px solid var(--line);border-radius:0 0 12px 12px;padding:14px;font:17px/1.7 'Plus Jakarta Sans',sans-serif;outline:none;background:#fff}
.thumb{width:160px;height:100px;border-radius:12px;background:#cfe0d3 center/cover;border:1px solid var(--line);margin-top:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 22px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:.3s;pointer-events:none;z-index:50;max-width:90%;text-align:center}
.toast.show{opacity:1}
.note{background:#f3f9ec;border-radius:12px;padding:12px 14px;font-size:13.5px;color:#41574a;margin-top:16px}
.err{background:#fde8ea;color:#8a0016}
.contact{display:grid;grid-template-columns:1fr 1.35fr;gap:20px;align-items:start;margin-bottom:30px}
.contact .panel{margin:20px 0 0}
.intro.small{padding:30px 34px}.intro.small h1{font-size:34px}.intro.small:after{content:"💌 🔒"}
.socs{display:flex;gap:8px;flex-wrap:wrap}
.soc{display:inline-block;padding:8px 14px;border-radius:999px;background:#f3f9ec;border:1px solid var(--line);font-weight:700;font-size:13.5px;text-decoration:none}
.soc:hover{background:var(--lime)}
footer a{color:#cfe5d6}
details.tip{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:10px 0;background:#fff}
details.tip.new{border-color:var(--lime);background:#f8fdf0}
details.tip summary{cursor:pointer;list-style:none;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
details.tip summary::-webkit-details-marker{display:none}
.tipbody{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
@media(max-width:720px){.contact{grid-template-columns:1fr}}
.cmts{max-width:820px;margin:-26px auto 50px}
.cmt{padding:14px 0;border-bottom:1px solid var(--line)}
.cmt:last-of-type{border-bottom:0}
.cmeta{font-size:13px;color:var(--muted);margin-bottom:4px}
.cbody{white-space:pre-wrap;word-wrap:break-word;font-size:15.5px}
.cform{margin-top:14px;padding-top:6px;border-top:2px solid var(--line)}
@media(max-width:720px){.hero{grid-template-columns:1fr}.hero .img{min-height:210px}.row{grid-template-columns:1fr}article.full .in{padding:22px 18px}article.full h1{font-size:28px}article.full .cover{height:230px}.hero h2{font-size:24px}.intro{padding:30px 22px;border-radius:22px}.intro h1{font-size:30px}.intro:after{display:none}}
</style>
</head>
<body>
<header class="site"><div class="wrap top">
  <div><a class="logo" href="#/" id="logo"></a><div class="tag" id="tagline"></div></div>
  <div class="ui" id="adminLinks"></div>
</div></header>
<nav class="cats"><div class="wrap" id="cats"></div></nav>
<main class="wrap" id="app"></main>
<footer><div class="wrap" id="foot"></div></footer>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ====== FYLL I DINA UPPGIFTER (Supabase → Project Settings → API) ======
const SUPABASE_URL = 'https://qwkrffkdsjtohkpuflyr.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_tFMUDfLV3IsgdTGAg83PtA_7vRtgMFU';
// =======================================================================
const CONTACT_EMAIL = 'Robinsmail.inbox@gmail.com';
// Sätt till true ENDAST när du faktiskt har utgivningsbevis (beviljas av Myndigheten för press, radio och tv).
// Är det false döljs utgivningsbevis-texten och sidfotens rad om utgivningsbevis.
const UTGIVNINGSBEVIS = true;
// Sociala medier: klistra in hela länkar mellan citattecknen (tomma visas inte)
const SOCIALS = { instagram:'', tiktok:'', youtube:'', x:'', facebook:'' };

(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const fmt=d=>{try{return new Date(d).toLocaleDateString('sv-SE',{year:'numeric',month:'long',day:'numeric'})}catch(e){return d}};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}

const configured=!/DITT-PROJEKT|DIN-ANON/.test(SUPABASE_URL+SUPABASE_ANON_KEY);
const sb=configured?supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY):null;
const DEF={name:'Nyhetsfocus',tagline:'Nyheter, intervjuer och drama från den svenska influencervärlden',cats:['Nyheter','Intervjuer','Skvaller & drama','Influencers','Sociala medier','Politik']};
let settings={...DEF}, admin=false, list=[], seq=0, tips=[], newTips=0;

function clean(html){
  const d=new DOMParser().parseFromString('<div>'+(html||'')+'</div>','text/html');
  const ok=['P','BR','B','STRONG','I','EM','U','H2','H3','UL','OL','LI','A','BLOCKQUOTE','IMG','DIV','SPAN','HR'];
  (function walk(n){[...n.children].forEach(c=>{
    if(!ok.includes(c.tagName)){c.replaceWith(...c.childNodes);return}
    [...c.attributes].forEach(a=>{
      const keep=(c.tagName==='A'&&(a.name==='href'||a.name==='target'))||(c.tagName==='IMG'&&(a.name==='src'||a.name==='alt'));
      if(!keep)c.removeAttribute(a.name);
    });
    if(c.tagName==='A'){const h=c.getAttribute('href')||'';if(!/^(https?:|mailto:|#)/i.test(h.trim()))c.removeAttribute('href');c.setAttribute('rel','noopener');c.setAttribute('target','_blank')}
    if(c.tagName==='IMG'){const s=c.getAttribute('src')||'';if(!/^https?:/i.test(s))c.remove()}
    walk(c)})})(d.body.firstChild);
  return d.body.firstChild.innerHTML;
}
const safeUrl=u=>/^https?:/i.test(u||'')?u.replace(/'/g,'%27').replace(/"/g,'%22').replace(/\)/g,'%29').replace(/\(/g,'%28'):'';
const bg=a=>a.image?"background-image:url('"+safeUrl(a.image)+"')":'background:linear-gradient(135deg,#c8102e,#111)';
const EMO={'Nyheter':'📰','Intervjuer':'🎤','Skvaller & drama':'🔥','Influencers':'⭐','Sociala medier':'📱','Politik':'🏛️','YouTube':'▶️','Trender':'📈'};
const emo=c=>EMO[c]||'✨';
const PAL=[['#e5f6d3','#1d5a2c'],['#ffe1ea','#a3173f'],['#e8e3ff','#4b2fb0'],['#ffedd5','#b45309'],['#dbeafe','#1d4ed8'],['#fef9c3','#854d0e']];
const catStyle=c=>{let i=settings.cats.indexOf(c);if(i<0)i=0;const p=PAL[i%PAL.length];return 'background:'+p[0]+';color:'+p[1]};
const LIST_COLS='id,title,summary,cat,author,image,date,status';

// ---------- data ----------
async function loadSettings(){
  const {data}=await sb.from('site_settings').select('*').eq('id',1).maybeSingle();
  if(data)settings={name:data.name||DEF.name,tagline:data.tagline??DEF.tagline,cats:(data.cats&&data.cats.length)?data.cats:DEF.cats};
}
async function checkAdmin(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){admin=false;return}
  const {data}=await sb.rpc('is_admin');admin=data===true;
  if(admin){const {count}=await sb.from('tips').select('id',{count:'exact',head:true}).eq('status','new');newTips=count||0}
}
async function loadList(){
  const {data,error}=await sb.from('articles').select(LIST_COLS).order('date',{ascending:false}).order('created_at',{ascending:false});
  if(error){toast('Kunde inte hämta artiklar');list=[];return}
  list=data||[];
}
async function getOne(id){
  const {data}=await sb.from('articles').select('*').eq('id',id).maybeSingle();return data;
}

// ---------- layout ----------
function chrome(){
  $('#logo').innerHTML='<img src="IMG_0520.png" class="logoimg" alt="Nyhetsfocus"><span>Nyhetsfocus</span>';

  document.title=settings.name;
  $('#tagline').textContent=settings.tagline;
  $('#adminLinks').innerHTML=admin
    ?'<a class="btn sm alt" href="#/admin">Hantera'+(newTips?' ('+newTips+')':'')+'</a> <a class="btn sm" href="#/admin/ny">+ Ny artikel</a> <button class="btn sm dark" id="lo">Logga ut</button>'
    :'<a class="btn sm" href="#/kontakt">💌 Tipsa oss</a> <a class="btn sm alt" href="#/admin">Admin</a>';
  const lo=$('#lo');if(lo)lo.onclick=async()=>{await sb.auth.signOut();admin=false;location.hash='#/';render()};
  $('#foot').innerHTML='<div><b>'+esc(settings.name)+'</b><br>'+esc(settings.tagline)+'<br><a href="#/kontakt">💌 Kontakt &amp; tipsa</a></div><div style="text-align:right">© '+new Date().getFullYear()+' '+esc(settings.name)+'<br>Ansvarig utgivare: Robin Axén'+(UTGIVNINGSBEVIS?'<br>Innehar utgivningsbevis':'')+'</div>';
}
function cats(active){
  $('#cats').innerHTML='<a data-c="" class="'+(!active?'on':'')+'">🔥 Senaste</a>'+settings.cats.map(c=>'<a data-c="'+esc(c)+'" class="'+(active===c?'on':'')+'">'+emo(c)+' '+esc(c)+'</a>').join('');
  $('#cats').querySelectorAll('a').forEach(a=>a.onclick=()=>{location.hash=a.dataset.c?'#/kat/'+encodeURIComponent(a.dataset.c):'#/'});
}
const draftTag=a=>a.status!=='published'?'<span class="draft">UTKAST</span>':'';
const card=a=>'<div class="card" data-id="'+a.id+'"><div class="img" style="'+bg(a)+'"></div><div class="body"><span class="pill" style="'+catStyle(a.cat)+'">'+emo(a.cat)+' '+esc(a.cat)+draftTag(a)+'</span><h3>'+esc(a.title)+'</h3><p>'+esc(a.summary)+'</p><div class="meta">'+fmt(a.date)+' · '+esc(a.author)+'</div></div></div>';

function home(cat,q){
  cats(cat);
  let l=list;
  if(cat)l=l.filter(a=>a.cat===cat);
  if(q)l=l.filter(a=>(a.title+' '+a.summary).toLowerCase().includes(q.toLowerCase()));
  let h=(!cat&&!q)?'<section class="intro"><span class="badge">🔥 Färskt just nu</span><h1>Allt om <em>influencers</em>, drama &amp; nyheter</h1><p>'+esc(settings.tagline)+'</p><a class="btn lime" href="#senaste" onclick="document.getElementById(\'senaste\').scrollIntoView({behavior:\'smooth\'});return false">Läs senaste ↓</a></section>':'';
  h+='<div class="search"><input id="q" type="text" placeholder="Sök bland nyheter…" value="'+esc(q||'')+'"></div>';
  if(!l.length)h+='<div class="empty">Inga artiklar hittades.</div>';
  else{
    let rest=l;
    if(!q){const f=l[0];rest=l.slice(1);
      h+='<div class="sec" id="senaste">⚡ Senaste nytt</div><div class="hero" data-id="'+f.id+'"><div class="img" style="'+bg(f)+'"></div><div class="body"><span class="pill" style="'+catStyle(f.cat)+'">'+emo(f.cat)+' '+esc(f.cat)+draftTag(f)+'</span><h2>'+esc(f.title)+'</h2><p>'+esc(f.summary)+'</p><div class="meta">'+fmt(f.date)+' · '+esc(f.author)+'</div></div></div>'}
    if(rest.length&&!q)h+='<div class="sec">🗞️ Mer att läsa</div>';
    h+='<div class="grid">'+rest.map(card).join('')+'</div>';
  }
  $('#app').innerHTML=h;
  $('#q').oninput=e=>{const v=e.target.value;clearTimeout(window._t);window._t=setTimeout(()=>{home(cat,v);const i=$('#q');i.focus();i.setSelectionRange(v.length,v.length)},250)};
  $('#app').querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>location.hash='#/artikel/'+el.dataset.id);
}

async function view(id){
  cats('');
  const a=await getOne(id);
  if(!a){$('#app').innerHTML='<div class="empty">Artikeln finns inte.<br><br><a class="btn" href="#/">Till startsidan</a></div>';return}
  document.title=a.title+' – '+settings.name;
  $('#app').innerHTML='<article class="full">'+(a.image?'<div class="cover" style="'+bg(a)+'"></div>':'')+'<div class="in"><span class="pill" style="'+catStyle(a.cat)+'">'+emo(a.cat)+' '+esc(a.cat)+draftTag(a)+'</span><h1>'+esc(a.title)+'</h1><p class="lead">'+esc(a.summary)+'</p><div class="meta" style="margin-bottom:22px">'+fmt(a.date)+' · av '+esc(a.author)+'</div><div class="content">'+clean(a.content)+'</div><div class="actions"><a class="btn alt" href="#/">← Alla nyheter</a>'+(admin?'<a class="btn" href="#/admin/redigera/'+a.id+'">Redigera</a>':'')+'<button class="btn alt" id="sh">Kopiera länk</button></div></div></article>';
  $('#sh').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href);toast('Länk kopierad')};
  commentsSection(a);
}

function login(){
  cats('null');
  $('#app').innerHTML='<div class="panel" style="max-width:420px;margin:50px auto"><h2>Logga in</h2><label>E-post</label><input type="email" id="em" autocomplete="username"><label>Lösenord</label><input type="password" id="pw" autocomplete="current-password"><div class="actions"><button class="btn" id="go">Logga in</button></div><div class="note">Endast redaktörer har tillgång. Besökare behöver inte logga in.</div></div>';
  const go=async()=>{
    const b=$('#go');b.disabled=true;

      :'<div class="note">Kommentarer öppnas när artikeln är publicerad.</div>');
    sec.querySelectorAll('[data-cd]').forEach(l=>l.onclick=async e=>{
      e.preventDefault();if(!confirm('Ta bort kommentaren permanent?'))return;

      if(body.length<2)return toast('Skriv en kommentar först');
      send.disabled=true;send.textContent='Skickar…';

      toast('Tack för din kommentar!');load();
    };
  }
  draw();load();
}

const TYPES={tips:'💡 Tips',kontakt:'✉️ Kontakt',rattelse:'🛠️ Rättelse'};

const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
function toJpegBlob(file,max){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=rej;r.onload=()=>{const img=new Image();img.onerror=rej;img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error('bild')),'image/jpeg',.82)};img.src=r.result};r.readAsDataURL(file)})}

function bindTips(){
  const root=$('#app');
  root.querySelectorAll('details.tip').forEach(d=>d.addEventListener('toggle',async()=>{
    const t=tips.find(x=>x.id===d.dataset.id);
    if(d.open&&t&&t.status==='new'){t.status='read';d.classList.remove('new');const n=d.querySelector('.draft');if(n)n.remove();newTips=Math.max(0,newTips-1);await sb.from('tips').update({status:'read'}).eq('id',t.id);chrome()}
  }));
  root.querySelectorAll('[data-ts]').forEach(b=>b.onclick=async()=>{
    const {error}=await sb.from('tips').update({status:b.dataset.ts}).eq('id',b.dataset.id);
    if(error)return toast('Misslyckades: '+error.message);
    await loadTips();chrome();adminPage()});
  root.querySelectorAll('[data-td]').forEach(b=>b.onclick=async()=>{
    if(!confirm('Ta bort meddelandet permanent?'))return;
    const t=tips.find(x=>x.id===b.dataset.id);
    if(t&&t.image_path)await sb.storage.from('tips').remove([t.image_path]);
    const {error}=await sb.from('tips').delete().eq('id',b.dataset.id);
    if(error)return toast('Misslyckades: '+error.message);
    toast('Borttaget');await loadTips();chrome();adminPage()});
  const imgs=[...root.querySelectorAll('[data-p]')];
  if(imgs.length)sb.storage.from('tips').createSignedUrls(imgs.map(a=>a.dataset.p),3600).then(({data})=>{(data||[]).forEach(d=>{const a=imgs.find(x=>x.dataset.p===d.path);if(a&&d.signedUrl)a.href=d.signedUrl})});
}

async function render(){
  const my=++seq;
  if(!configured){
    $('#app').innerHTML='<div class="panel"><h2>Koppla till Supabase</h2><div class="note err">Sidan är inte kopplad än. Öppna <b>index.html</b>, fyll i <b>SUPABASE_URL</b> och <b>SUPABASE_ANON_KEY</b> högst upp i scriptet och följ README.md.</div></div>';
    $('#logo').textContent=settings.name;return;
  }
  const h=location.hash.replace(/^#\/?/,'').split('/');
  await Promise.all([loadSettings(),checkAdmin()]);
  if(my!==seq)return;
  chrome();window.scrollTo(0,0);
  if(h[0]==='kontakt')return contact();
  if(h[0]==='admin'){
    if(!admin)return login();
    if(h[1]==='ny')return editor(null);
    if(h[1]==='redigera')return editor(h[2]);
    await Promise.all([loadList(),loadTips()]);if(my!==seq)return;return adminPage();
  }
  if(h[0]==='artikel')return view(h[1]);
  await loadList();if(my!==seq)return;
  if(h[0]==='kat')return home(decodeURIComponent(h[1]||''));
  document.title=settings.name;home('');
}
window.addEventListener('hashchange',render);
render();
})();
</script>
</body>
</html>
